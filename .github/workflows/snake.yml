name: Generate contribution snake

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate SVG animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kevyndeusdara
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#158FC7
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#44DFFF

      - name: Publish animations to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
